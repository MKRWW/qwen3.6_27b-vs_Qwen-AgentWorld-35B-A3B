# Modelle unter Test. Endpoints + Sampling. Secrets kommen aus .env (nicht hier).
# Die model_id von B wird von scripts/probe_endpoints.sh ausgelesen -> hier eintragen.

models:
  A:
    name: Qwen3.6-27b
    endpoint: http://192.168.178.21:8000/v1
    model_id: qwen3.6-27b
    api_key_env: QWEN_API_KEY        # vLLM lokal akzeptiert oft beliebigen Key
    quant: int4-autoround
    notes: LAN (2x RTX 3090), vLLM, qwen3-tool-parser aktiv, max_model_len=262144

  B:
    name: AgentWorld-35B-A3B
    endpoint: http://194.228.55.129:37773/v1
    model_id: lovedheart/Qwen-AgentWorld-35B-A3B-NVFP4
    api_key_env: AGENTWORLD_API_KEY
    quant: nvfp4
    notes: vast.ai (1x RTX PRO 5000), MoE 35B/3B-aktiv, Tool-Parser AKTIV (verifiziert), max_model_len=32000

  J:
    name: mistral-small-24b @ OpenRouter (neutraler Judge)
    endpoint: https://openrouter.ai/api/v1
    model_id: mistralai/mistral-small-24b-instruct-2501
    api_key_env: OPENROUTER_API_KEY
    quant: hosted
    notes: >-
      Neutraler DRITTER Judge (weder A noch B). Validiert: wendet die pre-existing-
      Plausibilitaetsregel korrekt an (Version-Mismatch=90), wo gpt-4o-mini scheiterte
      (=0). Imperfekt bei manchen Listing-Faellen -> Judge-Scores mit Vorbehalt.
      Guenstig (~$0.05/$0.08 pro Mio tok). NUR fuer Judging nutzen (kostet echtes Geld).

# Fairness-Cap: B serviert nur 32k Kontext, A 262k -> beide Prompts auf 32k begrenzen.
context_cap_tokens: 32000

# Track-1-Harness-Settings (hermes). IDENTISCH fuer A und B = Paritaet.
# Hintergrund: B (AgentWorld) serviert nur 32k, hermes verlangt aber >=64k. Wir
# ueberschreiben context_length auf 64000 (Pflicht, sonst Start verweigert) UND
# cappen max_tokens auf 2048, damit reale Requests in B's 32k-Fenster passen.
# Dieselben Werte fuer A, damit der Agent-Loop fair vergleichbar ist.
# Siehe docs/HERMES_SETUP.md fuer die volle Recipe + Begruendung.
hermes:
  context_length: 64000     # Override (B real 32k < hermes-Floor 64k)
  max_tokens: 2048          # Output-Cap, damit Requests in B's 32k passen
  max_turns: 30
  toolset: hermes-cli       # Standard-Bundle (Shell + Datei-Editing)

# Sampling-Regime (siehe docs/METHODOLOGY.md §1)
sampling_regimes:
  greedy:
    temperature: 0.0
    top_p: 1.0
    seed: 7
  card:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    seed: 7

max_tokens:
  track1_policy: 2048
  track2_worldmodel: 32768  # Card-Empfehlung; B's Thinking braucht real ~9-11k -> 8192 truncated

judge:
  # Self-Judging vermeiden: B wird nie von B gejudged.
  default: A          # lokaler Qwen-Judge
  alt: claude         # optionale Gegenprobe (separater Lauf)
